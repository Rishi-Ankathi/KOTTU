# Netlify build config for the KOTTU site.
# Set PUBLIC_KOTTU_API in Site settings -> Environment variables (not here).

[build]
  base    = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Python isn't used to build this site, but Netlify's build tool (mise)
  # scans the whole repo, finds requirements.txt (the ML pipeline / api/),
  # and defaults to the newest Python - which has no TensorFlow wheel yet.
  # The authoritative pin for mise is the root .python-version file; this is
  # kept in sync as a backup for anything that still reads the env var.
  PYTHON_VERSION = "3.12"
